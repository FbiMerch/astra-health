<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>ASTRA Health - Recuperare Parolă</title>
    <style>
        :root {
            --bg-primary: #0a0f1d;
            --bg-secondary: #111a2e;
            --bg-card: #16223f;
            --border-color: #233554;
            --text-main: #e2e8f0;
            --text-muted: #8892b0;
            --accent-cyan: #00f0ff;
            --accent-green: #10b981;
            --font-tech: 'Courier New', Courier, monospace;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 30px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .logo-title { font-family: var(--font-tech); color: var(--accent-cyan); font-size: 1.2rem; text-align: center; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 0.85rem; color: var(--text-muted); }
        .form-group input {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
        }
        .btn-submit {
            background: var(--accent-cyan);
            color: var(--bg-primary);
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.95rem;
        }
        .success-msg { background: rgba(16,185,129,0.15); color: var(--accent-green); border: 1px solid var(--accent-green); padding: 10px; border-radius: 6px; font-size: 0.85rem; display: none; }
        .links-row { text-align: center; font-size: 0.85rem; }
        .links-row a { color: var(--accent-cyan); text-decoration: none; }
    </style>
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div class="card">
    <div class="logo-title">⚡ RECUPERARE PAROLĂ</div>
    <div id="successAlert" class="success-msg" role="status" aria-live="polite">Resetarea parolei nu este conectată: aplicația nu are server de email sau serviciu de identitate. Contactează administratorul misiunii.</div>
    <form id="forgotForm" style="display: flex; flex-direction: column; gap: 15px;">
        <p style="font-size: 0.85rem; color: var(--text-muted); line-height: 1.4;">Recuperarea automată necesită un backend de autentificare, care nu este configurat în acest prototip.</p>
        <div class="form-group">
            <label for="recoveryEmail">Email Adresă</label>
            <input type="email" id="recoveryEmail" required placeholder="ex: mihailertea@gmail.com">
        </div>
        <button type="submit" class="btn-submit">TRIMITE INSTRUCȚIUNI</button>
        <div class="links-row">
            <a href="login.html">← Înapoi la Autentificare</a>
        </div>
    </form>
</div>
<script src="js/auth.js"></script>
<script>
    document.getElementById("forgotForm").addEventListener("submit", (e) => {
        e.preventDefault();
        document.getElementById("successAlert").style.display = "block";
    });
</script>

</body>
</html>
