<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>ASTRA Health - Login Portal</title>
    <style>
        :root {
            --bg-primary: #0a0f1d;
            --bg-secondary: #111a2e;
            --bg-card: #16223f;
            --border-color: #233554;
            --text-main: #e2e8f0;
            --text-muted: #8892b0;
            --accent-cyan: #00f0ff;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --font-tech: 'Courier New', Courier, monospace;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .login-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 30px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .logo-title { font-family: var(--font-tech); color: var(--accent-cyan); font-size: 1.3rem; text-align: center; letter-spacing: 1px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 0.85rem; color: var(--text-muted); }
        .form-group input {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
        }
        .btn-submit {
            background: var(--accent-cyan);
            color: var(--bg-primary);
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            transition: opacity 0.2s;
        }
        .btn-submit:hover { opacity: 0.85; }
        .links-row { display: flex; justify-content: space-between; font-size: 0.85rem; }
        .links-row a { color: var(--accent-cyan); text-decoration: none; }
        .error-msg { background: rgba(239,68,68,0.15); color: var(--accent-red); border: 1px solid var(--accent-red); padding: 10px; border-radius: 6px; font-size: 0.85rem; display: none; }
        .demo-creds { background: var(--bg-card); padding: 10px; border-radius: 6px; font-size: 0.75rem; color: var(--text-muted); border: 1px dashed var(--border-color); }
    </style>
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div class="login-card">
    <div class="logo-title">⚡ ASTRA HEALTH ACCESS</div>
    <div id="errorAlert" class="error-msg"></div>
    <form id="loginForm" style="display: flex; flex-direction: column; gap: 15px;">
        <div class="form-group">
            <label for="email">Email Adresă</label>
            <input type="email" id="email" required placeholder="ex: mihailertea@gmail.com">
        </div>
        <div class="form-group">
            <label for="password">Parolă</label>
            <input type="password" id="password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn-submit">AUTENTIFICARE</button>
        <div class="links-row">
            <a href="forgot-password.html">Ai uitat parola?</a>
            <a href="signup.html">Creează cont nou</a>
        </div>
    </form>
    <div class="demo-creds">
        <strong>Conturi demo testare</strong> (parola pentru toate: <code>ASTRA-Demo-2026!</code>):<br>
        - Astronaut: mihailertea@gmail.com<br>
        - Medic: elena.vancea@astra.med<br>
        - Comandant: john.miller@astra.cmd
    </div>
</div>
<script src="js/auth.js"></script>
<script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        const errBox = document.getElementById("errorAlert");

        try {
            await window.authService.login(email, password);
            window.location.href = "index.html";
        } catch (err) {
            errBox.textContent = err.message;
            errBox.style.display = "block";
        }
    });
</script>
</body>
</html>
